<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookeo Schedule Parser — home_fullWB → Assign GMs</title>
<style>
  :root { color-scheme: light dark; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  header{position:sticky;top:0;z-index:2;background:#0f172a;color:#fff;padding:.8rem 1rem;border-bottom:3px solid #16a34a}
  header h1{font-size:1.05rem;margin:0}
  main{padding:16px;max-width:1240px;margin:auto}
  .card{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.15);border-radius:14px;padding:12px;margin-bottom:12px}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .row.spread{justify-content:space-between}
  button{cursor:pointer;border:1px solid #374151;background:#111827;color:#fff;border-radius:10px;padding:.55rem .8rem}
  button.secondary{background:#374151}
  button.danger{background:#7f1d1d}
  input[type="text"],textarea,input[type="number"],select{border:1px solid #bbb;border-radius:8px;padding:.45rem .55rem;background:#fff}
  input[type="file"]{padding:.45rem;background:#fff;border-radius:8px;border:1px solid #bbb}
  .grid-wrap{overflow:auto;border-radius:12px;border:1px solid #bbb;background:#fff}
  table{border-collapse:separate;border-spacing:0;width:100%}
  th,td{border-bottom:1px solid #eee;padding:.55rem .6rem;text-align:left;vertical-align:top}
  thead th{position:sticky;top:0;background:#f8fafc;border-bottom:2px solid #ddd;z-index:1}
  tbody tr:nth-child(odd){background:#fafafa}
  .chip{display:inline-flex;align-items:center;gap:.35rem;background:#e5e7eb;border:1px solid #cbd5e1;border-radius:999px;padding:.25rem .55rem;margin:.2rem}
  .chip input{margin-right:.25rem}
  .muted{opacity:.75}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  .badge{padding:.15rem .45rem;border-radius:6px;background:#eef2ff;color:#1e3a8a;border:1px solid #c7d2fe;display:inline-block}
  .warn{background:#fff7ed;color:#7c2d12;border-color:#fed7aa}
  .ok{color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0}
  .conflict{color:#991b1b;font-weight:600}
  .avail-list{font-size:.85rem; line-height:1.35}
  details pre{white-space:pre-wrap;background:#0b1020;color:#e2e8f0;padding:8px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<header><h1>Upload Bookeo HTML → Find <code>div.home_fullWB</code> → Assign GMs</h1></header>

<main>
  <!-- Upload (auto-parse on select) -->
  <div class="card">
    <div class="row">
      <label><b>Exported HTML</b> <input id="htmlFile" type="file" accept=".html,.htm,text/html" /></label>
      <span id="status" class="badge mono">Ready.</span>
    </div>
    <div class="muted small" style="margin-top:.4rem">
      This parser collects any element whose class list contains <code>home_fullWB</code>. Parsing starts automatically after you pick a file.
    </div>
  </div>

  <!-- Shift Roster Controls -->
  <div class="card">
    <div class="row spread">
      <div class="row">
        <b>Shift GMs:</b>
        <div id="rosterChips" class="row"></div>
      </div>
      <div class="row">
        <label>Add GM <input id="empName" type="text" placeholder="e.g., Alex" /></label>
        <button id="addEmp" class="secondary">Add</button>
        <label title="Show only shift GMs in dropdowns"><input type="checkbox" id="onlyShift" checked> Use shift GMs in dropdowns</label>
        <label title="Default game length for conflict detection"><span class="muted">Slot length (min)</span> <input id="slotMin" type="number" value="60" min="10" step="5" style="width:5.5rem"></label>
      </div>
    </div>
  </div>

  <!-- Games Grid -->
  <div class="card">
    <div class="grid-wrap">
      <table id="grid">
        <thead>
          <tr id="headRow">
            <th style="width:110px">Time</th>
            <th>Game</th>
            <th style="width:200px">Assign GM</th>
            <th>Available GMs (no conflicts)</th>
            <th style="width:100px">#</th>
            <th>✕</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:.6rem">
      <button id="exportCsv">Export CSV</button>
      <button id="saveNow" class="secondary">Save</button>
      <button id="printNow" class="secondary">Print</button>
      <button id="deleteAll" class="danger" title="Remove all games from the grid">Delete All</button>
      <span id="status2" class="badge mono" style="margin-left:auto">—</span>
    </div>
  </div>

  <!-- Debug -->
  <div class="card">
    <details>
      <summary><b>Debug</b> (what the parser found)</summary>
      <div id="debug" class="mono"></div>
    </details>
  </div>
</main>

<script>
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const statusEl = $('#status'), status2El = $('#status2');
const setStatus = s => (statusEl.textContent = s);
const setStatus2 = s => (status2El.textContent = s);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2,10);
function tclean(s){ return String(s||'').replace(/\s+/g,' ').replace(/[“”]/g,'"').trim(); }
function csv(s){ s=(s==null?'':String(s)); return /[\",\n]/.test(s) ? '"'+s.replace(/\"/g,'""')+'"' : s; }

/* ---- time parsing (12h → minutes since midnight) ---- */
function parseTimeToMin(s){
  if(!s) return null;
  s = String(s).trim().toUpperCase().replace(/\s+/g,' ');
  const m = s.match(/^(\d{1,2})[:.](\d{2})\s*(AM|PM)$/i);
  if(!m) return null;
  let hh = +m[1], mm = +m[2], ap = m[3].toUpperCase();
  if(hh === 12) hh = 0;
  let mins = hh*60 + mm;
  if(ap === 'PM') mins += 12*60;
  return mins; // 0..1439
}
/* overlap if intervals [a1,a2) and [b1,b2) intersect */
function overlaps(a1,a2,b1,b2){ return a1 < b2 && b1 < a2; }

/* ---------------- double-game rules ---------------- */
const DOUBLE_GAME_TITLES = ['tomb','vault','area d','outbreak'];
function isDoubleGameTitle(title){
  const g = String(title||'').toLowerCase();
  return DOUBLE_GAME_TITLES.some(k => g.includes(k));
}
function isDoubleGamePair(r1, r2){
  if(!r1 || !r2) return false;
  if(r1.tStart==null || r2.tStart==null) return false;
  if(!r1.gm || !r2.gm || r1.gm!==r2.gm) return false;
  if(!isDoubleGameTitle(r1.game) || !isDoubleGameTitle(r2.game)) return false;
  const diff = Math.abs(r1.tStart - r2.tStart); // minutes between starts
  return diff >= 30; // minimum 30 minutes between
}

/* ---------------- state (autosave) ---------------- */
const LS_KEY='bookeo-assign-shift-v1';
let state = {
  employees: ['GM 1','GM 2'],
  shift: {},                 // {name: true/false}
  rows: []                   // {id,time,game,status,notes, gm: <name|null>, tStart, tEnd}
};
try{ const raw=localStorage.getItem(LS_KEY); if(raw) state=JSON.parse(raw);}catch(e){}
const save = ()=>{ localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus2('Saved.'); };

/* ---------------- UI: roster ---------------- */
const rosterWrap = $('#rosterChips'), empName = $('#empName');

function renderRoster(){
  rosterWrap.innerHTML = '';
  state.employees.forEach((name, idx)=>{
    const chip = document.createElement('label');
    chip.className = 'chip';
    const checked = !!state.shift[name];
    chip.innerHTML = `
      <input type="checkbox" ${checked?'checked':''}>
      <span>${escapeHtml(name)}</span>
      <button type="button" title="Remove GM">×</button>
    `;
    const cb = chip.querySelector('input');
    cb.onchange = ()=>{ state.shift[name] = cb.checked; save(); renderRows(); };
    chip.querySelector('button').onclick = ()=>{
      // remove GM from employees, shift, and any assignments
      const n = state.employees[idx];
      state.employees.splice(idx,1);
      delete state.shift[n];
      state.rows.forEach(r=>{ if(r.gm === n) r.gm = null; });
      save(); renderAll();
    };
    rosterWrap.appendChild(chip);
  });
}
$('#addEmp').onclick = ()=>{
  const v = empName.value.trim();
  if(!v) return;
  if(state.employees.includes(v)) { setStatus2('GM already exists.'); return; }
  state.employees.push(v);
  state.shift[v] = true; // new GM starts on shift
  empName.value = '';
  save(); renderRoster(); renderRows();
};
$('#onlyShift').onchange = ()=> renderRows();
$('#slotMin').onchange = ()=> { recomputeTimes(); renderRows(); save(); };

/* ---------------- upload & auto-parse Bookeo ---------------- */
let uploadedHtml='';

$('#htmlFile').addEventListener('change', async e=>{
  const f=e.target.files?.[0];
  if(!f){ uploadedHtml=''; setStatus('No file'); return; }
  try{
    uploadedHtml = await f.text();
    const { markersCount, uniqueCount, added } = parseAndMerge(uploadedHtml);
    recomputeTimes();
    save(); renderRows();
    setStatus(`Loaded & parsed. home_fullWB: ${markersCount}. Added: ${added}/${uniqueCount}.`);
  }catch(err){
    console.error(err);
    setStatus('Error reading or parsing file.');
  }
});

/* Core parse routine (reused for auto-parse, and future drag/drop, etc.) */
function pullStatus(container){
  const txt = container.textContent || '';
  const m = txt.match(/(\d+)\s*booked.*?(\d+)\s*available/i);
  return m ? `${m[1]} booked, ${m[2]} available` : tclean(txt);
}

function parseCountsFromText(txt){
  if(!txt) return null;
  const m = String(txt).match(/(\d+)\s*booked.*?(\d+)\s*available/i);
  if(!m) return null;
  const booked = +m[1];
  const available = +m[2];
  return { booked, available, capacity: booked + available };
}

function parseAndMerge(htmlString){
  if(!htmlString) return { markersCount: 0, uniqueCount: 0, added: 0 };

  const doc = new DOMParser().parseFromString(htmlString, 'text/html');

  const markers = Array.from(
    doc.querySelectorAll('[class~="home_fullWB"], .home_fullWB, [class*="home_fullWB"]')
  );

  const rows = [];
  const debug = [];
  for(const card of markers){
    const timeEl  = card.querySelector('.home_infoTime');
    const titleEl = card.querySelector('.home_infoTitle');
    let time   = tclean(timeEl  ? timeEl.textContent  : '');
    let game   = tclean(titleEl ? titleEl.textContent : '').replace(/^[-–—]+\s*/, '');
    let status = pullStatus(card);
    if(!(time||game||status)) continue;
    const counts = parseCountsFromText(status || card.textContent || '');
    rows.push({ id:uid(), time, game, status, notes:'', gm:null, booked: counts?.booked ?? null, available: counts?.available ?? null, capacity: counts?.capacity ?? null });
    debug.push(`Row → time="${escapeHtml(time)}" | game="${escapeHtml(game)}" | status="${escapeHtml(status)}"`);
  }

  // De-duplicate by (time|game)
  const seen=new Set(), unique=[];
  for(const r of rows){
    const k=(r.time+'|'+r.game).toLowerCase();
    if(!seen.has(k)){ seen.add(k); unique.push(r); }
  }

  // Merge only new rows
  const existing = new Set(state.rows.map(r=>(r.time+'|'+r.game).toLowerCase()));
  let added = 0;
  for(const r of unique){
    const k=(r.time+'|'+r.game).toLowerCase();
    if(!existing.has(k)){ state.rows.push(r); existing.add(k); added++; }
  }

  $('#debug').innerHTML =
    `<div class="badge">home_fullWB found: ${markers.length}</div>
     <div class="badge">Unique rows parsed: ${unique.length}</div>
     <div class="badge warn">New rows added: ${added}</div>
     <pre>${debug.join('\n')}</pre>`;

  return { markersCount: markers.length, uniqueCount: unique.length, added };
}

/* ---------------- compute times for rows ---------------- */
function recomputeTimes(){
  const slot = Math.max(10, +$('#slotMin').value || 60);
  state.rows.forEach(r=>{
    const start = parseTimeToMin(r.time);
    r.tStart = start;
    r.tEnd   = start!=null ? start + slot : null;
  });
}

/* ---------------- availability & conflicts ---------------- */
function gmIsOnShift(name){ return $('#onlyShift').checked ? !!state.shift[name] : true; }

function gmIsAvailable(name, targetIndex){
  const t1 = state.rows[targetIndex].tStart, t2 = state.rows[targetIndex].tEnd;
  const target = state.rows[targetIndex];
  if(t1==null || t2==null) return true; // unknown time -> consider available
  for(let i=0;i<state.rows.length;i++){
    if(i===targetIndex) continue;
    const r = state.rows[i];
    if(r.gm !== name) continue;
    if(r.tStart==null || r.tEnd==null) continue;
    if(overlaps(t1,t2, r.tStart,r.tEnd)){
      // Overlap: allow if this qualifies as a double game pair
      if(isDoubleGamePair(target, r)) continue;
      return false;
    }
  }
  return true;
}
function availableGMsForRow(idx){
  return state.employees.filter(n => gmIsOnShift(n) && gmIsAvailable(n, idx));
}
function gmHasConflict(name, idx){
  if(!name) return false;
  return !gmIsAvailable(name, idx);
}

function gmIsDoubleGame(name, targetIndex){
  if(!name) return false;
  const target = state.rows[targetIndex];
  for(let i=0;i<state.rows.length;i++){
    if(i===targetIndex) continue;
    const r = state.rows[i];
    if(r.gm !== name) continue;
    if(isDoubleGamePair(target, r)) return true;
  }
  return false;
}

/* ---------------- grid rendering ---------------- */
const bodyEl = $('#body');

function renderRows(){
  bodyEl.innerHTML='';
  state.rows.forEach((r,idx)=>{
    const tr=document.createElement('tr');

    // TIME
    const tdTime=document.createElement('td');
    const inTime=document.createElement('input');
    inTime.type='text'; inTime.size=8; inTime.value=r.time||'';
    inTime.onchange=()=>{ r.time=inTime.value; recomputeTimes(); save(); renderRows(); };
    tdTime.appendChild(inTime);
    tr.appendChild(tdTime);

    // GAME
    const tdGame=document.createElement('td');
    const inGame=document.createElement('input');
    inGame.type='text'; inGame.size=28; inGame.value=r.game||'';
    inGame.oninput=()=>{ r.game=inGame.value; save(); };
    tdGame.appendChild(inGame);
    tr.appendChild(tdGame);

    // ASSIGN GM (dropdown)
    const tdAssign=document.createElement('td');
    const sel=document.createElement('select');
    // build options
    const pool = $('#onlyShift').checked ? state.employees.filter(gm=>state.shift[gm]) : state.employees.slice();
    const placeholder = document.createElement('option');
    placeholder.value=''; placeholder.textContent='— Select GM —';
    sel.appendChild(placeholder);
    pool.forEach(name=>{
      const opt=document.createElement('option');
      opt.value=name; opt.textContent=name;
      sel.appendChild(opt);
    });
    sel.value = r.gm || '';
    sel.onchange=()=>{ r.gm = sel.value || null; save(); renderRows(); };
    // conflict / double-game indicator
    const conflict = gmHasConflict(sel.value, idx);
    const isDouble = gmIsDoubleGame(sel.value, idx);
    if(conflict) sel.classList.add('conflict'); else sel.classList.remove('conflict');
    tdAssign.appendChild(sel);
    if(conflict){
      const warn=document.createElement('div'); warn.className='muted conflict'; warn.textContent='Conflict!';
      tdAssign.appendChild(warn);
    } else if(isDouble){
      const info=document.createElement('div'); info.className='muted'; info.textContent='Double Game!';
      tdAssign.appendChild(info);
    }
    tr.appendChild(tdAssign);

    // AVAILABLE GM LIST
    const tdAvail=document.createElement('td');
    tdAvail.className = 'avail-list';
    const avail = availableGMsForRow(idx);
    tdAvail.innerHTML = avail.length
      ? '<span class="badge ok">Available</span> ' + avail.map(escapeHtml).join(', ')
      : '<span class="badge warn">No roster GMs free</span>';
    tr.appendChild(tdAvail);

    // STATUS (#/# booked)
    const tdStatus=document.createElement('td');
    // derive counts from stored fields or fallback-parse status text
    let booked = (r.booked!=null ? r.booked : null);
    let capacity = (r.capacity!=null ? r.capacity : null);
    if(booked==null || capacity==null){
      const parsed = parseCountsFromText(r.status||'');
      if(parsed){ booked = parsed.booked; capacity = parsed.capacity; }
    }
    const label = (booked!=null)
      ? `${booked} booked`
      : (r.status || '—');
    tdStatus.textContent = label;
    tr.appendChild(tdStatus);

    // DELETE
    const tdDel=document.createElement('td');
    const btn=document.createElement('button'); btn.className='danger small'; btn.textContent='Delete';
    btn.onclick=()=>{ state.rows.splice(idx,1); save(); renderRows(); };
    tdDel.appendChild(btn);
    tr.appendChild(tdDel);

    bodyEl.appendChild(tr);
  });
}

/* ---------------- export / misc ---------------- */
$('#exportCsv').onclick=()=>{
  const rows=state.rows;
  const head=['Time','Game','Assigned GM','#'].join(',');
  const lines=rows.map(r=>{
    const counts = (r.booked!=null ? {booked:r.booked} : (parseCountsFromText(r.status||'')||{}));
    const disp = (counts.booked!=null) ? `${counts.booked} booked` : (r.status||'');
    return [csv(r.time), csv(r.game), csv(r.gm||''), csv(disp)].join(',');
  });
  const blob=new Blob([head+'\n'+lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='schedule.csv'; a.click(); URL.revokeObjectURL(a.href);
};
$('#saveNow').onclick=save;
$('#printNow').onclick=()=>window.print();
$('#deleteAll').onclick=()=>{
  if(!state.rows.length){ setStatus2('No rows to delete.'); return; }
  const ok = confirm('Delete all games from the grid? This cannot be undone.');
  if(!ok) return;
  state.rows = [];
  save();
  renderRows();
  setStatus2('All games deleted.');
};

/* ---------------- init ---------------- */
function renderAll(){ renderRoster(); recomputeTimes(); renderRows(); }
renderAll();
setStatus('Ready.');
setStatus2('—');
</script>
</body>
</html>
